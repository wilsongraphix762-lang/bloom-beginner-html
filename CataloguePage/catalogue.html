<!DOCTYPE html>
<html>
    <body>
        <head>
            <title>MVRT Catalogue</title>
        </head>

        <h1>MVRT Catalogue</h1>
        
        <div class="gallery">
            <div class="gallery-item">
                <h3>Ball Bearings</h3>
                <img src="CatalogueImgs/BallBearing.png" class="gallery-img"><br>
                <button onclick="addToCart('Ball Bearing')">Add to Cart</button>
            </div>
            <br>
            <div class="gallery-item">
                <h3>Kraken Motors</h3>
                <img src="CatalogueImgs/KrakenMotors.png" class="gallery-img"><br>
                <button onclick="addToCart('Kraken Motors')">Add to Cart</button>
            </div>
            <br>
            <div class="gallery-item">
                <h3>Omni Wheels</h3>
                <img src="CatalogueImgs/OmniWheels.png" class="gallery-img"><br>
                <button onclick="addToCart('Omniwheels')">Add to Cart</button>
            </div>
            <br>
            <div class="gallery-item">
                <h3>Pocketed Gears</h3>
                <img src="CatalogueImgs/PocketedGears.png" class="gallery-img"><br>
                <button onclick="addToCart('Pocketed Gears')">Add to Cart</button>
            </div>
            <br>
            <div class="gallery-item">
                <h3>Limelight Camera</h3>
                <img src="CatalogueImgs/VisionCamera.png" class="gallery-img"><br>
                <button onclick="addToCart('Limelight Camera')">Add to Cart</button>
            </div>
            <br>
            <div class="gallery-item">
                <h3>Wheel Treads</h3>
                <img src="CatalogueImgs/WheelTreads.png" class="gallery-img"><br>
                <button onclick="addToCart('Wheel Treads')">Add to Cart</button>
            </div>
        </div>

       <br><br>
       <hr>
       <br><br>
        <h1>Checkout</h1>

        <h2>Cart</h2>
        <ul id="cartUl">
        </ul>

        <form action="../index.html">
            <label for="name">Name (Last, First)</label>
            <input type="text" placeholder="John Doe" required><br><br>
            <label for="email">Email</label>
            <input type="email" placeholder="example123@gmail.com"><br><br>
            <label for="confirmation">Confirm that you want to purchase all listed items</label>
            <input type="checkbox" name="Confirm" required><br><br>
            <button type="submit">Finish</button>
        </form>

        <p><a href="../index.html">Back to main page</a></p>
    </body>
</html>
